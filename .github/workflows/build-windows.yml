name: Build LanChat for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --windowed --onefile --name LanChat --icon lanchat.ico --add-data "lanchat.ico;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: LanChat-Windows
          path: dist/LanChat.exe
          if-no-files-found: error
